/* ================= SHUFFLE ================= */

function shuffleVideos(array){

  for(
    let i=array.length-1;
    i>0;
    i--
  ){

    const randomIndex =
      Math.floor(
        Math.random() *
        (i+1)
      );

    const temp =
      array[i];

    array[i] =
      array[randomIndex];

    array[randomIndex] =
      temp;

  }

}

/* ================= LOAD SOURCE ================= */

function loadVideoSource(video){

  if(!video){
    return false;
  }

  if(
    video.dataset.loaded ===
    "true"
  ){

    return true;

  }

  const src =
    video.dataset.src;

  if(!src){
    return false;
  }

  try{

    video.src =
      src;

    video.preload =
      "metadata";

    video.dataset.loaded =
      "true";

    video.load();

    return true;

  }catch(error){

    return false;

  }

}

    return;
  }

  const box =
    video.parentElement
    ?.querySelector(
      ".network-status"
    );

  if(!box){
    return;
  }

  box.textContent =
    text;

  box.style.display =
    "block";

}


function hideNetworkMessage(
  video
){

  if(!video){
    return;
  }

  const box =
    video.parentElement
    ?.querySelector(
      ".network-status"
    );

  if(box){

    box.style.display =
      "none";

  }

}


/* ================= RECOVERY ================= */

function recoverVideo(video){

  if(!video){
    return;
  }

  if(
    video.dataset.recovering ===
    "true"
  ){

    return;

  }

  const src =
    video.dataset.src;

  if(!src){
    return;
  }

  video.dataset.recovering =
    "true";

  showNetworkMessage(
    video,
    "Reconnecting…"
  );

  const currentTime =
    video.currentTime || 0;

  const oldTimer =
    recoveryTimers.get(
      video
    );

  if(oldTimer){
    clearTimeout(oldTimer);
  }

  const timer =
    setTimeout(
      function(){

        try{

          video.src =
            src;

          video.load();

          const restore =
            function(){

              try{

                if(
                  isFinite(
                    currentTime
                  ) &&
                  currentTime > 0 &&
                  currentTime <
                  video.duration
                ){

                  video.currentTime =
                    currentTime;

                }

              }catch(error){}

              video.removeEventListener(
                "loadedmetadata",
                restore
              );

              const promise =
                video.play();

              if(
                promise !==
                undefined
              ){

                promise.catch(
                  function(){}
                );

              }

            };

          video.addEventListener(
            "loadedmetadata",
            restore
          );

        }catch(error){}

        setTimeout(
          function(){

            video.dataset.recovering =
              "false";

            hideNetworkMessage(
              video
            );

          },
          1200
        );

      },
      600
    );

  recoveryTimers.set(
    video,
    timer
  );

}


/* ================= RESET PREVIEW ================= */

function resetPreview(video){

  if(!video){
    return;
  }

  try{
    video.pause();
  }catch(error){}

  video.muted =
    true;

  video.loop =
    true;

  video.controls =
    false;

  video.controlsList =
    "nodownload noplaybackrate";

  video.dataset.fullUnlocked =
    "false";

  const player =
    video.parentElement;

    );

    player?.querySelector(
      ".preview-timer"
    );

    player?.querySelector(
      ".countdown"
    );

    player?.querySelector(

    );

    video.closest(

    );

  }

  if(status){
    status.textContent =
      "PREVIEW";
  }

  hideNetworkMessage(
    video
  );

}


/* ================= CREATE CARD ================= */

function createVideoCard(
  item,
  category,
  categoryIndex
){

  const number =
    String(
      categoryIndex+1
    ).padStart(
      2,
      "0"
    );

  const uniqueIndex =
    category +
    "-" +
    categoryIndex;

  const card =
    document.createElement(
      "div"
    );

  card.className =
    "video-card";

  if(!item.video){

    card.innerHTML = `

      <div class="video-number">
        VIDEO ${number}
      </div>

      <div class="player">

        <div class="placeholder">
          Video ${number} — Coming Soon
        </div>

      </div>

      <div class="video-info">

        <div class="video-title">
          ${item.title}
        </div>

        <div class="video-status">
          COMING SOON
        </div>

      </div>

    `;

    return card;

  }

  card.innerHTML = `

    <div class="video-number">
      VIDEO ${number}
    </div>

    <div class="player">

      <video
        id="preview-video-${uniqueIndex}"
        class="preview-video"
        data-src="${item.video}"
        data-video-index="${uniqueIndex}"
        data-loaded="false"
        data-full-unlocked="false"
        playsinline
        muted
        loop
        preload="none"
        controlsList="nodownload noplaybackrate"
        disablePictureInPicture
      ></video>

      <div class="preview-timer">
        PREVIEW
      </div>

      <div class="preview-overlay">

        <div class="preview-message">
          Preview Video 👀
        </div>

        <button
          type="button"
          class="watch-btn"
        >

          <span class="play-icon">
            ▶
          </span>

          WATCH VIDEO

        </button>

      </div>

      <div class="countdown">

        <div class="countdown-number">
          13
        </div>

        <div class="countdown-text">
          Your video will start shortly...
        </div>

      </div>

      <div class="network-status">
        Reconnecting…
      </div>

    </div>

    <div class="video-info">

      <div class="video-title">
        ${item.title}
      </div>

      <div class="video-status">
        PREVIEW
      </div>

    </div>

  `;

  const video =
    card.querySelector(
      ".preview-video"
    );

  const overlay =
    card.querySelector(
      ".preview-overlay"
    );

  const watchBtn =
    card.querySelector(
      ".watch-btn"
    );

  const timer =
    card.querySelector(
      ".preview-timer"
    );

  const countdown =
    card.querySelector(
      ".countdown"
    );

  const countdownNumber =
    card.querySelector(
      ".countdown-number"
    );

  const status =
    card.querySelector(
      ".video-status"
    );

  video.dataset.fullUnlocked =
    "false";

  return setupVideoEvents(
    video,
    item,
    overlay,
    watchBtn,
    timer,
    countdown,
    countdownNumber,
    status,
    card
  );

}
function setupVideoEvents(
  video,
  item,
  overlay,
  watchBtn,
  timer,
  countdown,
  countdownNumber,
  status,
  card
){

  watchBtn.addEventListener(
    "click",
    function(event){

      event.preventDefault();
      event.stopPropagation();

      if(activeCountdown &&
         activeCountdown !== video){

        cancelCountdown(
          activeCountdown
        );

      }

      if(activeFullVideo &&
         activeFullVideo !== video){

        resetFullVideo(
          activeFullVideo
        );

      }

      activePreview =
        null;

      activeCountdown =
        video;

      loadVideoSource(
        video
      );

      video.pause();

      try{
        video.currentTime =
          0;
      }catch(error){}

      video.muted =
        true;

      video.loop =
        false;

      video.controls =
        false;

      overlay.style.display =
        "none";

      watchBtn.style.display =
        "none";

      countdown.style.display =
        "flex";

      let seconds =
        13;

      countdownNumber.textContent =
        seconds;

      if(item.ad){

        window.open(
          item.ad,
          "_blank",
          "noopener,noreferrer"
        );

      }

      const countdownTimer =
        setInterval(
          function(){

            if(
              activeCountdown !==
              video
            ){

              clearInterval(
                countdownTimer
              );

              return;

            }

            seconds--;

            countdownNumber.textContent =
              seconds;

            if(seconds <= 0){

              clearInterval(
                countdownTimer
              );

              video._countdownTimer =
                null;

              activeCountdown =
                null;

              countdown.style.display =
                "none";

              timer.style.display =
                "none";

              video.dataset.fullUnlocked =
                "true";

              video.muted =
                false;

              video.controls =
                true;

              video.controlsList =
                "nodownload noplaybackrate";

              video.loop =
                false;

              try{
                video.currentTime =
                  0;
              }catch(error){}

              activeFullVideo =
                video;

              status.textContent =
                "WATCHING";

              const playPromise =
                video.play();

              if(
                playPromise !==
                undefined
              ){

                playPromise.catch(
                  function(){

                    recoverVideo(
                      video
                    );

                  }
                );

              }

              /*
                Full video চলার সময়ও
                visible preview চালু থাকবে।
              */

              findCenterVideo();

            }

          },
          1000
        );

      video._countdownTimer =
        countdownTimer;

    }
  );


  /* ================= VIDEO END ================= */

  video.addEventListener(
    "ended",
    async function(){

      if(
        video.dataset.fullUnlocked !==
        "true"
      ){

        return;

      }

      try{

        if(
          document.fullscreenElement
        ){

          await document.exitFullscreen();

        }

      }catch(error){}

      resetFullVideo(
        video
      );

      setTimeout(
        function(){

          findCenterVideo();

        },
        200
      );

    }
  );


  /* ================= WAITING ================= */

  video.addEventListener(
    "waiting",
    function(){

      if(
        video.dataset.fullUnlocked ===
        "true"
      ){

        showNetworkMessage(
          video,
          "Buffering…"
        );

      }

    }
  );


  /* ================= STALLED ================= */

  video.addEventListener(
    "stalled",
    function(){

      if(
        video.dataset.fullUnlocked ===
        "true"
      ){

        recoverVideo(
          video
        );

      }

    }
  );


  /* ================= PLAYING ================= */

  video.addEventListener(
    "playing",
    function(){

      hideNetworkMessage(
        video
      );

    }
  );


  video.addEventListener(
    "canplay",
    function(){

      hideNetworkMessage(
        video
      );

    }
  );


  /* ================= ERROR ================= */

  video.addEventListener(
    "error",
    function(){

      if(
        video.dataset.fullUnlocked ===
        "true"
      ){

        recoverVideo(
          video
        );

      }else{

        status.textContent =
          "VIDEO ERROR";

      }

    }
  );


  /* ================= DOWNLOAD PROTECTION ================= */

  video.addEventListener(
    "contextmenu",
    function(event){

      event.preventDefault();

    }
  );

  video.addEventListener(
    "dragstart",
    function(event){

      event.preventDefault();

    }
  );


  return card;

}


/* ================= CANCEL COUNTDOWN ================= */

function cancelCountdown(video){

  if(!video){
    return;
  }

  if(video._countdownTimer){

    clearInterval(
      video._countdownTimer
    );

    video._countdownTimer =
      null;

  }

  resetPreview(
    video
  );

  try{
    video.currentTime =
      0;
  }catch(error){}

  if(
    activeCountdown ===
    video
  ){

    activeCountdown =
      null;

  }

}


/* ================= RESET FULL ================= */

function resetFullVideo(video){

  if(!video){
    return;
  }

  if(video._countdownTimer){

    clearInterval(
      video._countdownTimer
    );

    video._countdownTimer =
      null;

  }

  try{
    video.pause();
  }catch(error){}

  try{
    video.currentTime =
      0;
  }catch(error){}

  video.muted =
    true;

  video.loop =
    true;

  video.controls =
    false;

  video.controlsList =
    "nodownload noplaybackrate";

  video.dataset.fullUnlocked =
    "false";

  resetPreview(
    video
  );

  if(
    activeFullVideo ===
    video
  ){

    activeFullVideo =
      null;

  }

  if(
    activePreview ===
    video
  ){

    activePreview =
      null;

  }

}


/* ================= START PREVIEW ================= */

function startPreview(video){

  if(!video){
    return;
  }

  if(activeCountdown){
    return;
  }

  if(
    video ===
    activeFullVideo
  ){

    return;

  }

  activePreview =
    video;

  loadVideoSource(
    video
  );

  video.muted =
    true;

  video.loop =
    true;

  video.controls =
    false;

  video.controlsList =
    "nodownload noplaybackrate";

  const overlay =
    video.parentElement
    .querySelector(
      ".preview-overlay"
    );

  const timer =
    video.parentElement
    .querySelector(
      ".preview-timer"
    );

  const status =
    video.closest(
      ".video-card"
    )?.querySelector(
      ".video-status"
    );

  if(overlay){

    overlay.style.display =
      "flex";

  }

  if(timer){

    timer.style.display =
      "block";

    timer.textContent =
      "PREVIEW";

  }

  if(status){

    status.textContent =
      "PREVIEW";

  }

  const playPromise =
    video.play();

  if(
    playPromise !==
    undefined
  ){

    playPromise.catch(
      function(){}
    );

  }

}


/* ================= RENDER ================= */

function renderCategory(
  categoryName
){

  const category =
    categories[
      categoryName
    ];

  const container =
    document.getElementById(
      category.container
    );

  if(!container){
    return;
  }

  container.innerHTML =
    "";

  category.videos.forEach(
    function(item,index){

      const card =
        createVideoCard(
          item,
          categoryName,
          index
        );

      container.appendChild(
        card
      );

      if(
        (index+1)%3 === 0
      ){

        container.appendChild(
          createBanner()
        );

      }

    }
  );

}

renderCategory(
  "instagram"
);

renderCategory(
  "india"
);

renderCategory(
  "global"
);


/* ================= VISIBLE PREVIEWS ================= */

function findCenterVideo(){

  if(activeCountdown){
    return;
  }

  const activeSection =
    document.querySelector(
      ".category-section.active"
    );

  if(!activeSection){
    return;
  }

  const videos =
    activeSection.querySelectorAll(
      ".preview-video"
    );

  if(!videos.length){
    return;
  }

  videos.forEach(
    function(video){

      if(
        video ===
        activeFullVideo
      ){

        return;

      }

      if(
        video.dataset.fullUnlocked ===
        "true"
      ){

        return;

      }

      const rect =
        video.getBoundingClientRect();

      const visible =
        rect.bottom > 0 &&
        rect.top <
        window.innerHeight;

      if(visible){

        loadVideoSource(
          video
        );

        video.muted =
          true;

        video.loop =
          true;

        video.controls =
          false;

        video.controlsList =
          "nodownload noplaybackrate";

        const promise =
          video.play();

        if(
          promise !==
          undefined
        ){

          promise.catch(
            function(){}
          );

        }

      }else{

        video.pause();

      }

    }
  );

}


/* ================= VISIBLE CHECK ================= */

function keepVisiblePreviewsRunning(){

  const activeSection =
    document.querySelector(
      ".category-section.active"
    );

  if(!activeSection){
    return;
  }

  const videos =
    activeSection.querySelectorAll(
      ".preview-video"
    );

  videos.forEach(
    function(video){

      if(
        video ===
        activeFullVideo
      ){

        return;

      }

      if(
        video.dataset.fullUnlocked ===
        "true"
      ){

        return;

      }

      const rect =
        video.getBoundingClientRect();

      const visible =
        rect.bottom > 0 &&
        rect.top <
        window.innerHeight;

      if(visible){

        loadVideoSource(
          video
        );

        video.muted =
          true;

        video.loop =
          true;

        video.controls =
          false;

        if(video.paused){

          const promise =
            video.play();

          if(
            promise !==
            undefined
          ){

            promise.catch(
              function(){}
            );

          }

        }

      }else{

        if(
          !video.paused
        ){

          video.pause();

        }

      }

    }
  );

}
/* ================= SCROLL ================= */

let scrollTimer =
  null;

window.addEventListener(
  "scroll",
  function(){

    if(activeCountdown){
      return;
    }

    clearTimeout(
      scrollTimer
    );

    scrollTimer =
      setTimeout(
        function(){

          findCenterVideo();

        },
        100
      );

  },
  {
    passive:true
  }
);


/* ================= CATEGORY ================= */

document
  .querySelectorAll(
    ".category-btn"
  )
  .forEach(
    function(button){

      button.addEventListener(
        "click",
        function(){

          const category =
            button.dataset.category;

          if(activeCountdown){

            cancelCountdown(
              activeCountdown
            );

          }

          if(activeFullVideo){

            resetFullVideo(
              activeFullVideo
            );

          }

          activePreview =
            null;

          document
            .querySelectorAll(
              ".preview-video"
            )
            .forEach(
              function(video){

                video.pause();

                video.muted =
                  true;

                video.loop =
                  true;

                video.controls =
                  false;

                video.dataset.fullUnlocked =
                  "false";

              }
            );

          document
            .querySelectorAll(
              ".category-btn"
            )
            .forEach(
              function(btn){

                btn.classList.remove(
                  "active"
                );

              }
            );

          button.classList.add(
            "active"
          );

          document
            .querySelectorAll(
              ".category-section"
            )
            .forEach(
              function(section){

                section.classList.remove(
                  "active"
                );

              }
            );

          const selected =
            document.getElementById(
              category
            );

          if(selected){

            selected.classList.add(
              "active"
            );

          }

          setTimeout(
            function(){

              findCenterVideo();

            },
            250
          );

        }
      );

    }
  );


/* ================= INITIAL ================= */

setTimeout(
  function(){

    findCenterVideo();

  },
  800
);


/* ================= AUTO PREVIEW ================= */

setInterval(
  function(){

    if(activeCountdown){
      return;
    }

    /*
      Full video চললেও
      visible preview বন্ধ হবে না।
    */

    findCenterVideo();

  },
  700
);


/* ================= FULLSCREEN ================= */

document.addEventListener(
  "fullscreenchange",
  function(){

    if(
      activeFullVideo &&
      !document.fullscreenElement
    ){

      activeFullVideo.controls =
        true;

      activeFullVideo.controlsList =
        "nodownload noplaybackrate";

      const promise =
        activeFullVideo.play();

      if(
        promise !==
        undefined
      ){

        promise.catch(
          function(){

            recoverVideo(
              activeFullVideo
            );

          }
        );

      }

      keepVisiblePreviewsRunning();

    }

  }
);


/* ================= VISIBILITY ================= */

document.addEventListener(
  "visibilitychange",
  function(){

    if(
      document.visibilityState !==
      "visible"
    ){

      document
        .querySelectorAll(
          ".preview-video"
        )
        .forEach(
          function(video){

            if(
              video !==
              activeFullVideo
            ){

              video.pause();

            }

          }
        );

      return;

    }

    if(activeFullVideo){

      const promise =
        activeFullVideo.play();

      if(
        promise !==
        undefined
      ){

        promise.catch(
          function(){

            recoverVideo(
              activeFullVideo
            );

          }
        );

      }

      keepVisiblePreviewsRunning();

      return;

    }

    findCenterVideo();

  }
);


/* ================= ONLINE ================= */

window.addEventListener(
  "online",
  function(){

    if(activeFullVideo){

      showNetworkMessage(
        activeFullVideo,
        "Reconnecting…"
      );

      recoverVideo(
        activeFullVideo
      );

    }

    findCenterVideo();

  }
);


/* ================= OFFLINE ================= */

window.addEventListener(
  "offline",
  function(){

    if(activeFullVideo){

      showNetworkMessage(
        activeFullVideo,
        "Internet connection lost…"
      );

    }

  }
);


/* ================= GLOBAL ERROR ================= */

document.addEventListener(
  "error",
  function(event){

    const target =
      event.target;

    if(
      target &&
      target.classList &&
      target.classList.contains(
        "preview-video"
      )
    ){

      if(
        target.dataset.fullUnlocked ===
        "true"
      ){

        recoverVideo(
          target
        );

      }else{

        const status =
          target.closest(
            ".video-card"
          )?.querySelector(
            ".video-status"
          );

        if(status){

          status.textContent =
            "VIDEO ERROR";

        }

      }

    }

  },
  true
);


/* ================= DOWNLOAD BLOCK ================= */

document.addEventListener(
  "contextmenu",
  function(event){

    const video =
      event.target.closest(
        "video"
      );

    if(video){

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "dragstart",
  function(event){

    const video =
      event.target.closest(
        "video"
      );

    if(video){

      event.preventDefault();

    }

  }
);


document.addEventListener(
  "keydown",
  function(event){

    const key =
      event.key.toLowerCase();

    if(
      (event.ctrlKey ||
       event.metaKey) &&
      (
        key === "s" ||
        key === "u"
      )
    ){

      event.preventDefault();
      event.stopPropagation();

    }

  }
);


/* ================= MOBILE PROTECTION ================= */

document.addEventListener(
  "touchstart",
  function(event){

    const video =
      event.target.closest(
        "video"
      );

    if(video){

      video.setAttribute(
        "disablePictureInPicture",
        ""
      );

      video.setAttribute(
        "controlsList",
        "nodownload noplaybackrate"
      );

    }

  },
  {
    passive:true
  }
);


/* ================= BUFFER WATCHDOG ================= */

setInterval(
  function(){

    if(!activeFullVideo){
      return;
    }

    const video =
      activeFullVideo;

    if(
      !video.paused &&
      video.readyState <= 2
    ){

      recoverVideo(
        video
      );

    }

  },
  5000
);


/* ================= FINAL ================= */

</script>
